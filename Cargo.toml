[workspace]
members = [
    "crates/poh",
    "crates/accounts",
    "crates/tx-processor",
    "crates/consensus",
    "crates/turbine",
    "crates/gossip",
    "crates/rpc",
    "crates/program-executor",
    "validator",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"
bincode = "1.3"
ed25519-dalek = { version = "3", features = ["serde"] }
curve25519-dalek = "4"
parking_lot = "0.12"
bytes = "1"
dashmap = "5"
async-trait = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
futures = "0.3"

[profile.release]
lto = true
opt-level = 3
strip = "symbols"
codegen-units = 1
